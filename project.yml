name: Atoikura
options:
  bundleIdPrefix: com.atoikura
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  TaxEngine:
    path: TaxEngine

targets:
  Atoikura:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Atoikura
    dependencies:
      - package: TaxEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atoikura.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: あといくら
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: ""

  AtoikuraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtoikuraTests
    dependencies:
      - target: Atoikura
      - package: TaxEngine

schemes:
  Atoikura:
    build:
      targets:
        Atoikura: all
        AtoikuraTests: [test]
    test:
      targets:
        - AtoikuraTests
    run:
      config: Debug
