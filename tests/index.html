<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>あといくら - テスト</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
        margin: 0;

        color: #1c1c1e;
        line-height: 1.6;

      .summary {
        font-size: 1.1rem;

      li { padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.08); font-size: 0.9rem; }
      li.ng { color: #b3261e; }
      .message { display: block; font-size: 0.8rem; color: #6c6c70; padding-left: 20px; }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #f2f2f7; }
        li { border-bottom-color: rgba(255,255,255,0.12); }
        .summary.ok { background: #14532d; color: #d8f2e3; }
        .summary.ng { background: #7f1d1d; color: #fbdcda; }
